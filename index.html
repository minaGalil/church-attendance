<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>حضور مدارس الأحد</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><h1>حضور مدارس الأحد</h1><p>نظام إدارة الأطفال والحضور</p></header><section id="login" class="panel"><h2>تسجيل الدخول</h2><form id="loginForm"><label>البريد الإلكتروني<input type="email" id="email" required autocomplete="username"></label><label>كلمة المرور<input type="password" id="password" required autocomplete="current-password"></label><button type="submit">دخول</button></form></section><section id="app" hidden><nav><strong id="who"></strong><button id="logout" class="secondary">تسجيل الخروج</button></nav><div class="panel"><h2>القائمة الرئيسية</h2><div id="tabs" class="tabs"><button data-view="children">الأطفال</button><button data-view="attendance">الحضور</button><button data-view="unregistered">بصمات غير مسجلة</button></div><p id="notice"></p><div id="content"></div></div></section><p id="message" role="status"></p><footer>البيانات محمية بصلاحيات Supabase. هذه نسخة تجريبية للقراءة فقط.</footer></main><script type="module" src="app.js"></script></body></html>
