<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#064a3e"><title>خدمة متوسط بنين | كاتدرائية مارمرقس الرسول بالكويت</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="hero" aria-label="كاتدرائية مارمرقس الرسول بالكويت - خدمة متوسط بنين"><img class="hero-bg" src="banner.png" alt="خدمة متوسط بنين - كاتدرائية مارمرقس الرسول بالكويت"><img class="church-logo" src="church-logo.png" alt="شعار كاتدرائية مارمرقس الرسول بالكويت"></header>
<div id="login" class="login-wrap"><section class="login-card"><img src="service-logo.png" alt="شعار خدمة متوسط بنين"><h1>تسجيل الدخول</h1><p>نظام إدارة الحضور والبصمات — خدمة متوسط بنين</p><form id="loginForm"><label>البريد الإلكتروني<input id="email" type="email" autocomplete="username" required></label><label>كلمة المرور<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">دخول إلى النظام</button></form></section></div>
<div id="app" class="layout" hidden>
<aside class="sidebar"><div class="account"><span class="avatar">●</span><div><strong id="who">المستخدم</strong><small id="roleLabel">مستخدم النظام</small></div></div><nav id="sideNav" aria-label="القائمة الرئيسية"><button data-view="home" class="active"><span>⌂</span> الرئيسية</button><button data-view="children"><span>♟</span> إدارة الشباب</button><button data-view="classes"><span>▣</span> إدارة الفصول</button><button data-view="attendance"><span>▦</span> الحضور</button><button data-view="unregistered"><span>!</span> بصمات غير مسجلة</button><hr><button data-view="reports"><span>▥</span> التقارير</button><button data-view="users"><span>⚙</span> إدارة المستخدمين</button></nav></aside>
<main class="main"><div class="topbar"><button id="logout" class="light">⇥ تسجيل الخروج</button><span id="appStatus">خدمة متوسط بنين</span></div><section class="panel"><div class="section-head"><h2 id="sectionTitle">الرئيسية</h2><span id="viewInfo"></span></div><div class="filter-card" id="filterCard"><h3>⌕ البحث والتصفية</h3><div class="filters"><label>البحث<input id="search" placeholder="الاسم أو رقم البصمة أو الفصل"></label><label>الفصل<select id="department"><option value="">كل الفصول</option></select></label><label id="statusLabel">حالة التسجيل<select id="statusFilter"><option value="">الكل</option><option value="registered">مسجل</option><option value="unregistered">غير مسجل</option></select></label><label>من تاريخ<input id="dateFrom" type="date"></label><label>إلى تاريخ<input id="dateTo" type="date"></label></div><div class="filter-actions"><button id="applyFilters">⌕ بحث</button><button id="clearFilters" class="light">↻ مسح الفلاتر</button></div></div><div class="actions"><button id="exportCsv" class="outline">▤ تصدير Excel (CSV)</button><button id="printPdf" class="outline">▣ طباعة / PDF</button></div><p id="notice" role="status"></p><div id="content"></div></section><p id="message" role="alert"></p></main></div>
<footer>كاتدرائية مارمرقس الرسول بالكويت — خدمة متوسط بنين</footer><script type="module" src="app.js"></script>
<dialog id="youthDialog" aria-labelledby="youthHeading"><h2 id="youthHeading">بيانات الشاب</h2><form id="youthForm" class="youth-form"></form><p id="youthFeedback" role="alert"></p><div class="dialog-actions"><button id="youthSave" type="submit" form="youthForm">حفظ البيانات</button><button id="youthCancel" type="button" class="light">إلغاء</button></div></dialog></body></html>
