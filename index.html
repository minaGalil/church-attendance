<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>خدمة متوسط بنين | كاتدرائية مارمرقس الرسول بالكويت</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header class="hero"><img src="Logo4.png" alt="شعار الكنيسة"><div><p>كاتدرائية مارمرقس الرسول بالكويت</p><h1>خدمة متوسط بنين</h1><p>نظام إدارة الحضور والبصمات</p></div></header><section id="login" class="panel"><h2>تسجيل الدخول</h2><form id="loginForm"><label>البريد الإلكتروني<input type="email" id="email" required autocomplete="username"></label><label>كلمة المرور<input type="password" id="password" required autocomplete="current-password"></label><button type="submit">دخول</button></form></section><section id="app" hidden><nav><strong id="who"></strong><button id="logout" class="secondary">تسجيل الخروج</button></nav><div class="panel"><h2 id="sectionTitle">إدارة الشباب</h2><div id="tabs" class="tabs"><button data-view="children">الشباب</button><button data-view="attendance">الحضور</button><button data-view="unregistered">بصمات غير مسجلة</button></div><div class="filters"><label>بحث بالاسم أو رقم البصمة<input id="search" placeholder="اكتب الاسم أو الرقم"></label><label>الفصل<select id="department"><option value="">كل الفصول</option></select></label><label>من تاريخ<input id="dateFrom" type="date"></label><label>إلى تاريخ<input id="dateTo" type="date"></label><button id="clearFilters" class="secondary" type="button">مسح الفلاتر</button></div><div class="actions"><button id="exportCsv" type="button">تصدير Excel (CSV)</button></div><p id="notice" role="status"></p><div id="content"></div></div></section><p id="message" role="status"></p><footer>واجهة عربية تجريبية — البيانات تُعرض وفق صلاحيات Supabase.</footer></main><script type="module" src="app.js"></script></body></html>
